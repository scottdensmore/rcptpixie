version: 2

project_name: rcptpixie

before:
  hooks:
    # Not "go mod tidy": tidy resolves dependencies at release time and can
    # rewrite go.mod/go.sum mid-run, dirtying the tree and aborting the release.
    # Tidiness is enforced in the PR lint job instead.
    - go mod download

builds:
  - main: ./cmd/rcptpixie
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/scottdensmore/rcptpixie/version.Version={{.Version}}
      - -X github.com/scottdensmore/rcptpixie/version.Commit={{.Commit}}
      - -X github.com/scottdensmore/rcptpixie/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
