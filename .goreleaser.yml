version: 2

project_name: rcptpixie

before:
  hooks:
    # Not "go mod tidy": tidy resolves dependencies at release time and can
    # rewrite go.mod/go.sum mid-run, dirtying the tree and aborting the release.
    # Tidiness is enforced in the PR lint job instead.
    - go mod download

builds:
  - main: ./cmd/rcptpixie
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/scottdensmore/rcptpixie/v2/version.Version={{.Version}}
      - -X github.com/scottdensmore/rcptpixie/v2/version.Commit={{.Commit}}
      - -X github.com/scottdensmore/rcptpixie/v2/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  # name_template is deprecated in v2; `goreleaser check` flags it.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'

# GoReleaser writes the Homebrew cask itself, replacing the release-published
# event chain that used to poke the tap. That chain broke twice over: the PAT it
# authenticated with expired, and a release created with the built-in
# GITHUB_TOKEN does not raise `release: published` for other workflows at all.
#
# More importantly the old formula built from source, so `brew install` ran
# `go build` in the repository root — which holds no Go files — and could never
# have worked. A cask installs the archive built here, so there is no Go
# toolchain at install time and the binary arrives with its version stamped in.
#
# A cask, not `brews:`: that section is deprecated and removed in GoReleaser
# v2.16. Casks are macOS-only, which matches where the README offers brew;
# Linux keeps the release tarball.
homebrew_casks:
  - name: rcptpixie
    binaries:
      - rcptpixie
    repository:
      owner: scottdensmore
      name: homebrew-tap
      branch: main
      # A cross-repository write cannot use the built-in token. Scope this one
      # to contents:write on homebrew-tap and nothing else.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/scottdensmore/rcptpixie"
    description: "Renames receipts and documents from what is written inside them, using a local LLM"
    license: "MIT"
    hooks:
      post:
        # The binaries are unsigned, so Gatekeeper quarantines them and the
        # first run dies with "cannot be opened because the developer cannot be
        # verified". Clearing the attribute is the documented cask workaround.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rcptpixie"]
          end
    # Set by the release workflow: "true" when no tap token is configured, so a
    # missing secret costs the cask update and never the binaries.
    skip_upload: "{{ .Env.SKIP_BREW }}"
