name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.ref }}

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # v6 tracks GoReleaser v2; it must stay in step with "version: 2" in
      # .goreleaser.yml.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # The built-in token, not a PAT: this publishes a release in THIS
          # repository, which the contents:write permission above already
          # covers. The PAT that used to be here expired and took the v2.0.0
          # release down with a 401. A PAT is only needed to reach another
          # repository, which is what trigger-formula-update.yml does.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
