name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.ref }}

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # v6 tracks GoReleaser v2; it must stay in step with "version: 2" in
      # .goreleaser.yml.
      # A missing tap token must cost the cask update, never the binaries.
      - name: Decide whether the Homebrew cask can be published
        id: brew
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; publishing binaries but skipping the Homebrew cask."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # The built-in token, not a PAT: this publishes a release in THIS
          # repository, which the contents:write permission above already
          # covers. The PAT that used to be here expired and took the v2.0.0
          # release down with a 401.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repository write; the built-in token cannot reach the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SKIP_BREW: ${{ steps.brew.outputs.skip }}
