name: Test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! read)

      - name: go vet
        run: go vet ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # One runner gets a real rasterizer so the vision path is exercised rather
      # than skipped everywhere.
      - name: Install poppler
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # No Ollama: every test that needs the API uses an httptest fake.
      - name: Run tests
        run: go test -race ./...
